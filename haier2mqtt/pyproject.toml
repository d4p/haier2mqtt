[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haier2mqtt"
version = "0.1.0"
description = "Haier heat pump (PyHaier/Modbus TCP) to MQTT bridge with local control logic"
requires-python = ">=3.12"
dependencies = [
  "pymodbus>=3.8,<3.9",
  "aiomqtt>=2.3,<3",
  "PyHaier==0.4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py312"
